# =============================================================================
# BigBug Application Services
# =============================================================================
#
# This file defines application services that are rebuilt and restarted
# frequently during development: databases, backend API and frontend UI.
#
# Prerequisites:
#   docker compose -f docker-compose.infra.yml up -d
#
# Usage:
#   docker compose -f docker-compose.app.yml up -d
#
# See examples/README.md for the full initialization workflow.
# =============================================================================

networks:
  bigbug-network:
    name: bigbug-network
    external: true

volumes:
  postgres_backend_data:
  redis_data:

services:
  # ─────────────────────────────────────────────────────────────
  # Backend database
  # ─────────────────────────────────────────────────────────────
  postgres-backend:
    image: postgres:17
    container_name: bigbug-postgres-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigbug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigbug}
      POSTGRES_DB: ${POSTGRES_DB:-bigbug}
    ports:
      - "5432:5432"
    volumes:
      - postgres_backend_data:/var/lib/postgresql/data
    networks:
      - bigbug-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigbug} -d ${POSTGRES_DB:-bigbug}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bigbug-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bigbug-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: bigbug-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bigbug}:${POSTGRES_PASSWORD:-bigbug}@postgres-backend:5432/${POSTGRES_DB:-bigbug}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bigbug}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-bigbug-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-bigbug-backend-secret}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_FRONTEND:-bigbug-frontend}
      GITLAB_URL: http://gitlab.local:8080
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - bigbug-network
    depends_on:
      postgres-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["app:start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # Frontend UI
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: bigbug-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bigbug-network
    depends_on:
      backend:
        condition: service_healthy
    command: yarn dev --host
