# ruff.toml — Конфигурация линтера и форматтера для BigBug backend.
#
# Используется ruff (замена flake8, isort, pyupgrade, и др.).
# Настройки pyproject.toml [tool.ruff] сохраняются для обратной совместимости,
# но приоритет имеет ruff.toml.

target-version = "py314"
line-length = 100

# Директории для исключения из проверки
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "alembic/versions",
    "dist",
    "build",
    "*.egg-info",
]

[lint]
# Правила для проверки
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style (issue #119)
]
ignore = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]            # неиспользуемые импорты в __init__.py — норма
"tests/**" = ["S101"]               # assert в тестах — норма
"tests/unit/_trust_certs_fixtures.py" = ["E501"]  # сгенерированные PEM-фикстуры
"alembic/**" = ["INP001"]           # alembic файлы без __init__.py
"app/api/**" = ["B008", "PT019", "PT028"]  # Depends() — DI; endpoints `test_*`/`_` — не pytest-семантика
"app/core/rbac.py" = ["B008"]      # FastAPI Depends() в зависимостях RBAC
"app/services/gitlab_projects/presets.py" = ["E501"]  # встроенные YAML-константы

# Test-quality rules (issue #119): pytest-style rules.
# TC (flake8-type-checking) намеренно НЕ включён: 137 unsafe-fixes в prod-коде
# (импорты в TYPE_CHECKING-блоки без `from __future__ import annotations` рискуют
# NameError) — отдельная работа, не входит в скоуп issue #119.
# PT011: pytest.raises-too-broad настроен через raises-require-match-for.
[lint.flake8-pytest-style]
raises-require-match-for = ["BaseException", "Exception", "ValueError", "KeyError"]

[format]
# Настройки форматирования (используется ruff format)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
