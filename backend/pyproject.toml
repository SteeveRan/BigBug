[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigbug-backend"
version = "0.1.0"
description = "DevOps Sync & Build Service — Backend"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Git
    "GitPython>=3.1",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Redis
    "redis>=5.0.0",
    # Rate limiting
    "pyrate-limiter>=4.4.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    # Settings
    "pydantic-settings>=2.3.0",
    "pydantic>=2.7.0",
    "pydantic[email]>=2.7.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # GitHub / GitLab
    "PyGithub>=2.3.0",
    "python-gitlab>=4.6.0",
    # Utilities
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "jsonschema>=4.20.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    # Linting & formatting
    "ruff>=0.11.0",
    "mypy>=1.13.0",
    # Dead code detection
    "vulture>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests (require infrastructure)",
]

[tool.coverage.run]
# E2E coverage: измеряем код приложения в отдельном процессе (uvicorn под
# coverage), поэтому source ограничен пакетом app, а тесты/миграции исключены.
source = ["app"]
branch = true
omit = ["alembic/*", "scripts/*", "docker/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
# Pragmatic baseline: not strict. Third-party packages (python-gitlab, PyGithub,
# apscheduler, authlib, etc.) ship without type stubs, so missing imports are
# ignored; the goal is a green run on the current code, not exhaustive typing.
ignore_missing_imports = true
# editable install (pip install -e .) exposes `app` twice under different roots;
# explicit package bases resolves the "Source file found twice" collision.
explicit_package_bases = true
plugins = [
    # Pydantic: understands `Field(default=...)` so mypy sees optional/required
    # fields correctly and does not demand every keyword arg on model creation.
    "pydantic.mypy",
    # SQLAlchemy legacy-declarative models use Column() class attributes; the
    # bundled plugin rewrites them to proper instance types (int/str/...) so mypy
    # does not flag `Column[int]` vs `int` on every ORM attribute access.
    "sqlalchemy.ext.mypy.plugin",
]

# ponytail: models use legacy `Column()` without `Mapped[]`, so the SQLAlchemy
# mypy plugin cannot infer attribute types and floods every ORM attribute access
# with `Column[int]` vs `int` noise. These error codes are silenced at the
# baseline. Upgrade path: migrate app/models/*.py to `Mapped[]`/`mapped_column()`
# (SQLAlchemy 2.0 style), then remove entries from this list incrementally to
# regain those checks. Real type errors (call-arg, misc, valid-type, no-redef,
# return-value, etc.) remain enabled.
disable_error_code = [
    "arg-type",      # `Column[int]` vs `int` on ORM attr arguments
    "assignment",    # assigning plain values to `Column[...]` attrs
    "attr-defined",  # `Column()` attrs seen as missing on model instances
    "var-annotated", # `Column()` attrs needing explicit type annotations
    "index",         # dict/list indexed by `Column[int]` instead of `int`
    "dict-item",     # dict keys/values typed as `Column[...]`
    "union-attr",    # union narrowing lost on legacy Column attrs
    "call-overload", # ORM-attr overload resolution on legacy Column
    "return-value",  # legacy Column leaking into inferred return types
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
"app/api/**" = ["B008"]             # FastAPI Depends() в аргументах — стандартный паттерн DI
"app/core/rbac.py" = ["B008"]      # FastAPI Depends() в зависимостях RBAC
