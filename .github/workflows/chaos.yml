name: Chaos gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chaos:
    name: Chaos tests (sync_engine convergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: chaos suite (tests/chaos/)
        run: ./backend/scripts/test-chaos.sh
