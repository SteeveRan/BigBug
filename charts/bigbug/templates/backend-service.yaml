apiVersion: v1
kind: Service
metadata:
  name: {{ include "bigbug.fullname" . }}-backend
  labels:
    {{- include "bigbug.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "bigbug.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
