# Pre-commit hooks (https://pre-commit.com). Install once per clone:
#   pip install pre-commit && pre-commit install
# Secret-scanning policy: ADR-0032; allowlist: .gitleaks.toml.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
