# Harbor chart values (ns harbor, issue #58). Chart 1.19.4 (harbor 2.15.4),
# pinned in harbor.tf. Adapted from the retired infrastructure/harbor/harbor-values.yaml:
# nodePort expose + TLS replaced by haproxy-ingress on :80 (ADR-0022, D4).

expose:
  type: ingress
  tls:
    enabled: false
  ingress:
    hosts:
      core: harbor.local
    className: haproxy
    # ssl-redirect default annotation must be explicitly disabled when TLS
    # is off (haproxy-ingress honors `ingress.kubernetes.io/ssl-redirect`)
    annotations:
      ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"

# http:// on :80 — matches the ingress addressing; docker commands must use
# harbor.local:80 (no TLS fallback, harbor-helm values comment)
externalURL: "http://harbor.local"

# Admin credentials (dev environment only)
harborAdminPassword: "Harbor12345"

# ── Persistence (dev-sized; local-path storage) ──────────────
persistence:
  enabled: true
  resourcePolicy: "keep"      # Preserve PVCs on uninstall
  persistentVolumeClaim:
    registry:
      size: 5Gi
    database:
      size: 2Gi
    redis:
      size: 1Gi
    trivy:
      size: 2Gi

# ── Disabled services (save dev resources) ───────────────────
trivy:
  enabled: false

notary:
  enabled: false
