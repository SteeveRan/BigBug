# =============================================================================
# BigBug Infrastructure Services
# =============================================================================
#
# This file defines infrastructure services that are rarely restarted:
# Keycloak (identity provider) and GitLab (CI/CD platform).
#
# Usage:
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# See infrastructure/README.md for the full initialization workflow.
# =============================================================================

networks:
  bigbug-network:
    name: bigbug-network
    driver: bridge

volumes:
  postgres_keycloak_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:

services:
  # ─────────────────────────────────────────────────────────────
  # Keycloak database
  # ─────────────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:17
    container_name: bigbug-postgres-keycloak
    environment:
      POSTGRES_USER: ${KC_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
      POSTGRES_DB: ${KC_POSTGRES_DB:-keycloak}
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - bigbug-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USER:-keycloak} -d ${KC_POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Identity provider
  # ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bigbug-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KC_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KC_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD:-keycloak}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS: "-Xms512m -Xmx768m"
    ports:
      - "8180:8180"
    networks:
      - bigbug-network
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # GitLab (CI/CD platform) — PostgreSQL is bundled inside the image
  # ─────────────────────────────────────────────────────────────
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: bigbug-gitlab
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local:8080'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-BigBugGitLab2024!Secure}'
        puma['port'] = 8081
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        nginx['listen_port'] = 8080
        nginx['listen_https'] = false
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_pages['enable'] = false
        postgresql['shared_buffers'] = "256MB"
    ports:
      - "8080:8080"
      - "8443:443"
      - "2222:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - bigbug-network
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: "256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/users/sign_in"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: bigbug-gitlab-runner
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigbug-network
    depends_on:
      gitlab:
        condition: service_healthy
